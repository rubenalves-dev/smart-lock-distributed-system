services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    networks:
      - smart-lock-net
    # Public ports removed for security

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: ai_service
    networks:
      - smart-lock-net
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq
    restart: always

  main-server:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: main_server
    networks:
      - smart-lock-net
    ports:
      - "8080:8080" # Exposed for Nginx proxy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AI_SERVICE_ADDR: ai-service:50051
      POSTGRES_URL: postgres://user:password@postgres:5432/lock_db?sslmode=disable
      MQTT_BROKER: mosquitto_broker
      <<: *influx_env
    depends_on:
      - rabbitmq
      - ai-service
      - postgres
      - influxdb
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks:
      - smart-lock-net
    ports:
      - "3000:8080" # Exposed for Nginx proxy
    environment:
      - NODE_ENV=production
    depends_on:
      - main-server
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    networks:
      - smart-lock-net
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lock_db
    # Public ports removed for security
    restart: always

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_broker
    networks:
      - smart-lock-net
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: always

  influxdb:
    image: influxdb:2.7
    container_name: influx_db
    networks:
      - smart-lock-net
    # Public ports removed for security
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    ports:
      - "8086:8086" # Exposed for Nginx proxy
    environment:
      <<: *influx_init_env
    restart: always

networks:
  smart-lock-net:
    driver: bridge

volumes:
  influxdb-data:
  influxdb-config:
  mosquitto-data:
  mosquitto-log:
