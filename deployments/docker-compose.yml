services:
  # Message Broker for Asynchronous calls
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    ports:
      - "5672:5672" # RabbitMQ port
      - "15672:15672" # Management UI (Username/Pass: guest/guest)

  # Python AI Service
  ai-service:
    build: ../ai-service
    container_name: ai_service
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "50051:50051"
    depends_on:
      - rabbitmq

  # Go Main Server
  main-server:
    build: ../backend
    container_name: main_server
    ports:
      - "8080:8080" # REST API for Web App
      - "50052:50052" # gRPC port
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AI_SERVICE_ADDR: ai-service:50051
      POSTGRES_URL: postgres://user:password@postgres:5432/lock_db?sslmode=disable
      MQTT_BROKER: mosquitto_broker
      <<: *influx_env
    depends_on:
      - rabbitmq
      - ai-service
      - postgres
      - influxdb

  # Database for the Go Service
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lock_db
    ports:
      - "5432:5432"

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always

  influxdb:
    image: influxdb:2.7
    container_name: influx_db
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      <<: *influx_init_env
    restart: unless-stopped

volumes:
  influxdb-data:
  influxdb-config:
