services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_broker
    networks:
      - smart-lock-net
    ports:
      - "5672:5672"
      - "15672:15672"

  ai-service:
    build: ../ai-service
    container_name: ai_service
    networks:
      - smart-lock-net
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq

  main-server:
    build: ../backend
    container_name: main_server
    networks:
      - smart-lock-net
    ports:
      - "8080:8080"
      - "50052:50052"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      AI_SERVICE_ADDR: ai-service:50051
      POSTGRES_URL: postgres://user:password@postgres:5432/lock_db?sslmode=disable
      MQTT_BROKER: mosquitto_broker
      <<: *influx_env
    depends_on:
      - rabbitmq
      - ai-service
      - postgres
      - influxdb

  frontend:
    build: ../frontend
    container_name: frontend
    networks:
      - smart-lock-net
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=development
    depends_on:
      - main-server

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    networks:
      - smart-lock-net
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lock_db
    ports:
      - "5432:5432"

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_broker
    networks:
      - smart-lock-net
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: always

  influxdb:
    image: influxdb:2.7
    container_name: influx_db
    networks:
      - smart-lock-net
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      <<: *influx_init_env
    restart: unless-stopped

networks:
  smart-lock-net:
    driver: bridge

volumes:
  influxdb-data:
  influxdb-config:
