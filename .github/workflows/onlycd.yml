name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: CD - Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose V2 plugin not found. Installing locally..."
              mkdir -p ~/.docker/cli-plugins
              ARCH=$(uname -m)
              if [ "$ARCH" = "x86_64" ]; then
                CLI_ARCH="linux-x86_64"
              elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                CLI_ARCH="linux-aarch64"
              else
                CLI_ARCH="linux-x86_64"
              fi
              URL="https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-${CLI_ARCH}"
              if command -v curl >/dev/null 2>&1; then
                curl -SL "$URL" -o ~/.docker/cli-plugins/docker-compose
              else
                wget -O ~/.docker/cli-plugins/docker-compose "$URL"
              fi
              chmod +x ~/.docker/cli-plugins/docker-compose
            fi
            cd ~/smart-lock-distributed-system
            git pull origin main
            # Force-remove the conflicting orphaned container and any duplicates from the previous crashed legacy run
            docker rm -f 45d697b020602e7a04049c406bf768092fcea206f3861db4a00ad30d90612164 || true
            docker rm -f $(docker ps -a -q -f "name=ai_service") 2>/dev/null || true
            docker compose -f deployments/docker-compose.prod.yml up -d --build
            docker image prune -f
