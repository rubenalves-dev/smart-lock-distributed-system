name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: CI - Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - name: Build images (compose)
        run: docker compose -f deployments/docker-compose.yml build

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Go tests
        run: cd backend && go test ./...

      - name: Bring stack up (smoke test)
        run: docker compose -f deployments/docker-compose.yml up -d

      - name: Tear down
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v

  deploy:
    name: CD - Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose V2 plugin not found. Installing locally..."
              mkdir -p ~/.docker/cli-plugins
              ARCH=$(uname -m)
              if [ "$ARCH" = "x86_64" ]; then
                CLI_ARCH="linux-x86_64"
              elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
                CLI_ARCH="linux-aarch64"
              else
                CLI_ARCH="linux-x86_64"
              fi
              URL="https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-${CLI_ARCH}"
              if command -v curl >/dev/null 2>&1; then
                curl -SL "$URL" -o ~/.docker/cli-plugins/docker-compose
              else
                wget -O ~/.docker/cli-plugins/docker-compose "$URL"
              fi
              chmod +x ~/.docker/cli-plugins/docker-compose
            fi
            cd ~/smart-lock-distributed-system
            git pull origin main
            docker compose -f deployments/docker-compose.prod.yml up -d --build
            docker image prune -f
